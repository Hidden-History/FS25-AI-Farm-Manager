name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.15.18

      - name: Ruff — correctness gate
        # Conservative, correctness-focused ruleset chosen to pass green on the
        # existing shipped code while still catching real bugs (E9 parse errors,
        # F821 undefined names, F811 redefinitions, etc.).
        # Ignored codes are pre-existing style/cleanliness nits in the shipped
        # scripts, not correctness defects — ignoring them keeps this a green,
        # non-blocking-of-existing-code gate:
        #   F401 unused import  F841 unused local var  F541 f-string w/o placeholder
        run: ruff check --select E9,F --ignore F401,F841,F541 .
