name: ✨ Feature request
description: Suggest an idea or improvement for the skill or the in-game mod.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search
        [existing issues](../issues) first — someone may have suggested it already.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the project would this touch?
      options:
        - "mod (in-game Lua notification cards)"
        - "skill (Claude Code save reader / advisor)"
        - "docs"
        - "not sure"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or gap you've run into.
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help — mockups, examples, references.
    validations:
      required: false
